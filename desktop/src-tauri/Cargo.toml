[package]
name = "nofakeip-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "NoFakeIP 桌面 / Android 客户端"
authors = ["NoFakeIP Contributors"]
license = "MIT"

# Tauri 移动端（Android/iOS）需要 staticlib/cdylib；桌面端用 rlib
[lib]
name = "nofakeip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

nofakeip-core = { path = "../../crates/nofakeip-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

# 与根 workspace 相同的构建调优（见 doc/11 第 6.2 节）：
# 本机有安全软件拦截文件写入，默认 debug 信息会让编译时间成倍增长。
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
