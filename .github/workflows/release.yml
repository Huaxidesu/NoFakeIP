name: 发布（手动触发）

# ============================================================================
# 手动触发的发布流水线
# ============================================================================
#
# 工作方式：
#   1. 在 Actions 页面点「Run workflow」，选一个目标平台；
#   2. 流水线自动从根 Cargo.toml 的 [workspace.package] version 读取版本号，
#      **不需要在任何地方手填版本**；
#   3. 编译出该平台的产物，按版本号命名后打包；
#   4. 自动创建（或更新）同名的 GitHub Release，把产物上传为 Release 资产，
#      并顺带打好对应的 git tag。
#
# 为什么要手动触发：发布是一件需要人来决定的事。自动在每次 push 时发布
# 会产出大量无意义的版本；改版本号 → 手动发布 → 得到一致的产物，更可控。
#
# 为什么 Linux 产物要放在这里：Tauri 的 Linux 目标依赖 webkit2gtk 等系统库，
# Windows 上没有可用的交叉编译链，只能在 Linux runner 上构建。
# 详见 doc/11-构建发布与Android.md 第 3.3 节。

on:
  workflow_dispatch:
    inputs:
      target:
        description: '要构建并发布的平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - android
      prerelease:
        description: '标记为预发布（Pre-release）'
        required: false
        default: false
        type: boolean
      dry_run:
        description: '只构建、不发布（产物留作 Actions 附件，不创建 Release）'
        required: false
        default: false
        type: boolean

# 创建 Release、推送 tag 都需要写权限。
permissions:
  contents: write

# 同一时间只允许一个发布会话，避免两个任务同时写同一个 Release。
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Node 22：与本地开发环境一致，且 Tauri 2 要求。
  NODE_VERSION: '22'

jobs:
  # ==========================================================================
  # 0. 准备：读取版本号，决定要构建哪些平台
  # ==========================================================================
  prepare:
    name: 读取版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      build_windows: ${{ steps.plan.outputs.windows }}
      build_linux: ${{ steps.plan.outputs.linux }}
      build_android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@v4

      # 版本号的唯一来源是根 Cargo.toml 的 [workspace.package] version。
      # 前端 package.json、tauri.conf.json、src-tauri/Cargo.toml 都靠
      # tools/set-version.mjs 同步；这里校验四处一致，不一致直接失败，
      # 避免发出「包版本号跟 Release 标题对不上」的版本。
      - name: 读取版本号并校验一致性
        id: ver
        run: |
          set -euo pipefail

          # 用 awk 精确取 [workspace.package] 段内的 version，
          # 不依赖「version 出现在前 N 行」这种脆弱假设。
          # split 按引号切，取第 2 段即为版本号（不要用 gsub 去引号 ——
          # `.*"|".*` 这种模式会把整行吃光）。
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_sec = 1; next }
            /^\[/ { in_sec = 0 }
            in_sec && /^version[[:space:]]*=/ {
              split($0, a, "\""); print a[2]; exit
            }
          ' Cargo.toml)

          if [ -z "${VERSION:-}" ]; then
            echo "::error::无法从 Cargo.toml 的 [workspace.package] 解析版本号"
            exit 1
          fi

          PKG=$(node -p "require('./desktop/package.json').version")
          TAURI=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          SRC=$(awk '
            /^\[package\]/ { in_sec = 1; next }
            /^\[/ { in_sec = 0 }
            in_sec && /^version[[:space:]]*=/ {
              split($0, a, "\""); print a[2]; exit
            }
          ' desktop/src-tauri/Cargo.toml)

          echo "Cargo.toml (workspace)            = $VERSION"
          echo "desktop/package.json              = $PKG"
          echo "desktop/src-tauri/tauri.conf.json = $TAURI"
          echo "desktop/src-tauri/Cargo.toml      = $SRC"

          ok=1
          [ "$VERSION" = "$PKG" ]   || { echo "::error::package.json ($PKG) 与 Cargo.toml ($VERSION) 不一致"; ok=0; }
          [ "$VERSION" = "$TAURI" ] || { echo "::error::tauri.conf.json ($TAURI) 与 Cargo.toml ($VERSION) 不一致"; ok=0; }
          [ "$VERSION" = "$SRC" ]   || { echo "::error::src-tauri/Cargo.toml ($SRC) 与 Cargo.toml ($VERSION) 不一致"; ok=0; }
          if [ "$ok" != "1" ]; then
            echo "::error::版本号不一致。本地运行 node tools/set-version.mjs $VERSION 可一键同步。"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"   >> "$GITHUB_OUTPUT"
          echo "✅ 版本号 $VERSION 四处一致"

      - name: 决定构建范围
        id: plan
        run: |
          TARGET="${{ inputs.target }}"
          echo "选择的目标：$TARGET"
          case "$TARGET" in
            all)     W=1; L=1; A=1 ;;
            windows) W=1; L=0; A=0 ;;
            linux)   W=0; L=1; A=0 ;;
            android) W=0; L=0; A=1 ;;
            *) echo "::error::未知目标 $TARGET"; exit 1 ;;
          esac
          echo "windows=$W" >> "$GITHUB_OUTPUT"
          echo "linux=$L"   >> "$GITHUB_OUTPUT"
          echo "android=$A" >> "$GITHUB_OUTPUT"

      # 汇总写进任务摘要，方便点进 Actions 一眼看清这次发了什么。
      - name: 写入任务摘要
        run: |
          {
            echo "## 发布准备"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本号 | \`${{ steps.ver.outputs.version }}\` |"
            echo "| Tag | \`${{ steps.ver.outputs.tag }}\` |"
            echo "| 目标平台 | \`${{ inputs.target }}\` |"
            echo "| 预发布 | \`${{ inputs.prerelease }}\` |"
            echo "| 仅构建 | \`${{ inputs.dry_run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # 1. Windows 桌面端（NSIS 安装包 + 便携 exe）
  # ==========================================================================
  desktop-windows:
    name: Windows 桌面端
    needs: prepare
    if: needs.prepare.outputs.build_windows == '1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # pnpm build = tsc --noEmit && vite build && node ../tools/verify-dist.mjs
      # 末尾的 verify-dist 会校验 dist 资源齐全，防止打出「空白应用」的包。
      - name: 构建桌面端（NSIS 安装包 + 便携 exe）
        working-directory: desktop
        run: pnpm tauri build --bundles nsis

      - name: 按版本号整理产物
        shell: pwsh
        working-directory: desktop/src-tauri/target/release
        run: |
          $V = "${{ needs.prepare.outputs.version }}"
          $Out = "stage"
          New-Item -ItemType Directory -Force -Path $Out | Out-Null

          # 便携版：target/release 下就是 nofakeip.exe
          Copy-Item "nofakeip.exe" "$Out/NoFakeIP_${V}_windows-portable.exe"

          # NSIS 安装包：目录里只有一个，按修改时间取最新的那个更稳妥
          $Setup = Get-ChildItem "bundle/nsis/*.exe" -ErrorAction Stop |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $Setup.FullName "$Out/NoFakeIP_${V}_x64-setup.exe"

          # 附一份产物说明，随包一起发出去。
          # 用字符串数组明确控制每一行，不用 here-string —— here-string 会
          # 把源码里的缩进原样带进文本，容易莫名多出一堆前导空格。
          $Lines = @(
            "NoFakeIP $V · Windows 版本",
            "",
            "  安装版：NoFakeIP_${V}_x64-setup.exe",
            "    双击运行安装向导，无需管理员权限。",
            "",
            "  便携版：NoFakeIP_${V}_windows-portable.exe",
            "    双击即用，不写注册表、不留安装痕迹。",
            "",
            "DNS 诊断与测速工具，面向 Fake-IP 模式用户。",
            "只做测量与判断，不生成、不修改任何软件配置。",
            "",
            "本项目未做代码签名，SmartScreen 可能提示「未知发布者」，",
            "选择「仍要运行」即可。"
          )
          # UTF-8 无 BOM 写出，避免中文乱码
          [System.IO.File]::WriteAllLines("$Out/README.txt", $Lines, (New-Object System.Text.UTF8Encoding $false))

          Get-ChildItem $Out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: desktop/src-tauri/target/release/stage/*
          if-no-files-found: error

  # ==========================================================================
  # 2. Windows CLI
  # ==========================================================================
  cli-windows:
    name: Windows CLI
    needs: prepare
    if: needs.prepare.outputs.build_windows == '1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建 CLI
        run: cargo build --release -p nofakeip-cli

      - name: 按版本号打包
        shell: pwsh
        run: |
          $V = "${{ needs.prepare.outputs.version }}"
          $Out = "stage/nofakeip-cli_${V}_windows-x64"
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          Copy-Item "target/release/nofakeip.exe" $Out
          Compress-Archive -Path "$Out/*" -DestinationPath "$Out.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: stage/*.zip
          if-no-files-found: error

  # ==========================================================================
  # 3. Android（arm64 竖屏 APK）
  # ==========================================================================
  android:
    name: Android APK
    needs: prepare
    if: needs.prepare.outputs.build_android == '1'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: 安装 NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # CI 上 dl.google.com 可达，不需要本地那套镜像补丁；
      # 但 gen/android 不入库，必须重新 init。
      - name: 初始化 Android 工程
        working-directory: desktop
        run: pnpm tauri android init --ci

      # CI runner 的 NDK 路径与本地不同，用环境变量覆盖交叉编译配置。
      - name: 指向 CI 的 NDK
        working-directory: desktop/src-tauri
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          ar = "$NDK/llvm-ar"
          linker = "$NDK/aarch64-linux-android24-clang"
          [target.armv7-linux-androideabi]
          ar = "$NDK/llvm-ar"
          linker = "$NDK/armv7a-linux-androideabi24-clang"
          [target.i686-linux-android]
          ar = "$NDK/llvm-ar"
          linker = "$NDK/i686-linux-android24-clang"
          [target.x86_64-linux-android]
          ar = "$NDK/llvm-ar"
          linker = "$NDK/x86_64-linux-android24-clang"
          EOF

      # CI 上 D8/R8 用的是 runner 自带的 Android SDK，本地那套「免 dl.google.com」
      # 的 compileSdk 降级补丁（E13-2）不需要。这里把 targetSdk 之外的构建
      # 交给 Tauri 默认模板即可。
      - name: 构建 APK
        working-directory: desktop
        run: pnpm tauri android build --apk

      # 历史事故：APK 里的 .so 可能是 0 字节，装上直接崩，而构建不报错。
      # 见 doc/11-构建发布与Android.md 第 2.8 节。
      # 注意要取**最大的那个** .so —— universal 包里有多个 ABI，
      # 只看第一行可能撞上一个空的。
      - name: 校验 APK 内的原生库
        working-directory: desktop
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E '\.so$' || true

          # 取所有 .so 里最大的那个作为判据
          MAX=$(unzip -l "$APK" | awk '/\.so$/ { if ($1 + 0 > m) m = $1 + 0 } END { print m + 0 }')
          echo "最大 .so：${MAX} 字节"

          if [ "$MAX" -lt 1000000 ]; then
            echo "::error::APK 内的 .so 最大只有 ${MAX} 字节（应为 10 MB 量级）"
            exit 1
          fi
          echo "✅ 原生库大小正常"

      - name: 按版本号整理产物
        working-directory: desktop
        run: |
          V="${{ needs.prepare.outputs.version }}"
          mkdir -p stage
          # 不加 --target 时 Tauri 产出的是 universal flavor（打包全部 ABI），
          # 文件名为 app-universal-release.apk；加了 --target 才会是 arm64 / armv7。
          # 这里从**路径**判断 flavor，不要从文件名猜。
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "原始 APK：$APK"

          if echo "$APK" | grep -q '/arm64/'; then
            FLAVOR=arm64
          elif echo "$APK" | grep -q '/armv7/'; then
            FLAVOR=armv7
          else
            FLAVOR=universal
          fi

          cp "$APK" "stage/NoFakeIP_${V}_${FLAVOR}.apk"

          # 附一份产物说明
          cat > "stage/README.txt" <<EOF
          NoFakeIP $V · Android 版本

            文件：NoFakeIP_${V}_${FLAVOR}.apk

          安装：传到手机后点击安装。首次会提示「不允许安装未知应用」，
                去 设置 → 应用 → 特殊权限 → 安装未知应用 里给文件管理器或浏览器授权。

          说明：DNS 诊断与测速工具，面向 Fake-IP 模式用户。
                只做测量与判断，不生成、不修改任何软件配置。
                本 APK 使用自签名证书，仅供安装测试。
          EOF

          ls -la stage/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: desktop/stage/*.apk
          if-no-files-found: error

  # ==========================================================================
  # 4. Linux 桌面端（AppImage）
  # ==========================================================================
  desktop-linux:
    name: Linux 桌面端
    needs: prepare
    if: needs.prepare.outputs.build_linux == '1'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Ubuntu 22.04 的 glibc 较老（2.35），产出的 AppImage 向上兼容性更好。
      # 不要改成 24.04。
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: 构建 AppImage
        working-directory: desktop
        run: pnpm tauri build --bundles appimage

      - name: 按版本号整理产物
        working-directory: desktop
        run: |
          V="${{ needs.prepare.outputs.version }}"
          mkdir -p stage
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          cp "$APPIMAGE" "stage/NoFakeIP_${V}_amd64.AppImage"
          chmod +x "stage/NoFakeIP_${V}_amd64.AppImage"
          ls -la stage/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: desktop/stage/*.AppImage
          if-no-files-found: error

  # ==========================================================================
  # 5. Linux CLI
  # ==========================================================================
  cli-linux:
    name: Linux CLI
    needs: prepare
    if: needs.prepare.outputs.build_linux == '1'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建 CLI
        run: cargo build --release -p nofakeip-cli

      - name: 按版本号打包
        run: |
          V="${{ needs.prepare.outputs.version }}"
          OUT="nofakeip-cli_${V}_linux-x64"
          mkdir -p "$OUT"
          cp target/release/nofakeip "$OUT/"
          tar -czf "$OUT.tar.gz" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: nofakeip-cli_*.tar.gz
          if-no-files-found: error

  # ==========================================================================
  # 6. 发布：创建 / 更新 Release，上传全部产物
  # ==========================================================================
  publish:
    name: 发布到 Releases
    needs: [prepare, desktop-windows, cli-windows, android, desktop-linux, cli-linux]
    # 全部前置任务都处于「成功 / 被跳过」状态才发布（被跳过 = 本次没选那个平台）。
    # 只要有一个失败，这里就不会跑，避免发出残缺的版本。
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      inputs.dry_run == false &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 打平目录：上传时每个 artifact 一层子目录，Release 资产不需要这层。
      - name: 整理待上传文件
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f ! -name '*.sha256' -exec cp {} release-assets/ \;

          echo "待上传文件："
          ls -la release-assets/

          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::没有任何产物可发布 —— 检查上游 job 是否都成功了"
            exit 1
          fi

          # 生成校验和，方便用户验证下载完整性。
          # 只对真实产物做校验和，不要把 SHA256SUMS.txt 自己也算进去。
          ( cd release-assets && find . -maxdepth 1 -type f -printf '%f\n' \
              | sort | xargs sha256sum > SHA256SUMS.txt )
          echo "校验和："
          cat release-assets/SHA256SUMS.txt

      - name: 写入发布说明
        run: |
          V="${{ needs.prepare.outputs.version }}"
          cat > RELEASE_NOTES.md <<EOF
          ## NoFakeIP $V

          DNS 诊断与测速工具，面向 Fake-IP 模式用户。
          **只做测量与判断，不生成也不修改任何软件配置。**

          ### 下载

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | Windows | \`NoFakeIP_${V}_x64-setup.exe\` | 安装版，无需管理员权限 |
          | Windows | \`NoFakeIP_${V}_windows-portable.exe\` | 便携版，双击即用 |
          | Android | \`NoFakeIP_${V}_arm64.apk\` | 直接安装（universal 包则不含 arm64 后缀） |
          | Linux | \`NoFakeIP_${V}_amd64.AppImage\` | 添加执行权限后运行 |
          | CLI | \`nofakeip-cli_${V}_*.zip\` / \`.tar.gz\` | 命令行版本，解压即用 |

          完整说明见 [README](https://github.com/${{ github.repository }}/blob/master/README.md)，
          详细文档见 [Wiki](https://github.com/${{ github.repository }}/wiki)。

          ### 完整性校验

          下载后可对照 \`SHA256SUMS.txt\` 校验文件是否损坏。

          > Windows 版未做代码签名，SmartScreen 可能提示「未知发布者」，选择「仍要运行」即可。
          > Android 版使用自签名证书，仅供安装测试。
          EOF

      - name: 创建 / 更新 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: NoFakeIP ${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          prerelease: ${{ inputs.prerelease }}
          # tag 不存在时自动创建；已存在则复用（支持「只补发某个平台」）
          make_latest: ${{ inputs.prerelease == false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 写入结果摘要
        run: |
          {
            echo "## ✅ 发布完成"
            echo ""
            echo "版本：\`${{ needs.prepare.outputs.version }}\`"
            echo ""
            echo "Release 页面：https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # 7. 仅构建模式：产物只留在 Actions 附件里，不碰 Release
  # ==========================================================================
  archive-only:
    name: 仅构建（不发布）
    needs: [prepare, desktop-windows, cli-windows, android, desktop-linux, cli-linux]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      inputs.dry_run == true &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总为单个压缩包
        run: |
          V="${{ needs.prepare.outputs.version }}"
          tar -czf "NoFakeIP_${V}_all-builds.tar.gz" -C artifacts .
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: all-builds-${{ needs.prepare.outputs.version }}
          path: NoFakeIP_*_all-builds.tar.gz
          retention-days: 14

      - name: 写入结果摘要
        run: |
          {
            echo "## 🧪 仅构建完成（未发布）"
            echo ""
            echo "版本：\`${{ needs.prepare.outputs.version }}\`"
            echo ""
            echo "产物在本次运行的 Actions 附件中，保留 14 天。"
          } >> "$GITHUB_STEP_SUMMARY"
